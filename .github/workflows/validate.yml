name: Validate configuration

on:
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          persist-credentials: false

      - name: Validate JSON
        run: |
          python3 -I - <<'PY'
          import json

          def reject_constant(value):
              raise ValueError(f"Invalid JSON constant: {value}")

          for path in (
              ".cursor-plugin/plugin.json",
              ".mcp.json",
              ".antigravity-plugin/plugin.json",
              "mcp_config.json",
          ):
              with open(path, encoding="utf-8") as file:
                  json.load(file, parse_constant=reject_constant)
          PY

      - name: Reject hardcoded MCP tool names
        run: |
          # Granola's MCP server routes agents to the right tool; naming tools here goes stale when the server changes.
          if grep -rnE '`[a-z]+(_[a-z]+)+`' skills agents commands; then
            echo "Describe what to do and let the Granola server pick the tool, instead of naming MCP tools."
            exit 1
          fi
